<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>监控系统仪表板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .status-firing { color: #dc3545; }
        .status-acknowledged { color: #ffc107; }
        .status-resolved { color: #28a745; }
        .severity-warning { color: #ffc107; }
        .severity-critical { color: #dc3545; }
        .card-header { background-color: #f8f9fa; }
        .refresh-indicator { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .metric-card { transition: transform 0.2s; }
        .metric-card:hover { transform: translateY(-2px); }
        .alert-item { border-left: 4px solid #dee2e6; margin-bottom: 10px; }
        .alert-item.firing { border-left-color: #dc3545; }
        .alert-item.acknowledged { border-left-color: #ffc107; }
        .alert-item.resolved { border-left-color: #28a745; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 页面标题 -->
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="text-center">
                    <i class="fas fa-chart-line"></i> 监控系统仪表板
                </h1>
                <p class="text-center text-muted">实时监控告警规则和事件</p>
            </div>
        </div>

        <!-- 刷新指示器 -->
        <div class="refresh-indicator">
            <div class="alert alert-info" id="refreshStatus">
                <i class="fas fa-sync-alt" id="refreshIcon"></i>
                <span id="lastUpdate">正在加载...</span>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card metric-card">
                    <div class="card-body text-center">
                        <h5 class="card-title">
                            <i class="fas fa-cogs text-primary"></i> 告警规则
                        </h5>
                        <h3 class="text-primary" id="totalRules">-</h3>
                        <small class="text-muted">活跃: <span id="activeRules">-</span></small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card">
                    <div class="card-body text-center">
                        <h5 class="card-title">
                            <i class="fas fa-exclamation-triangle text-danger"></i> 告警事件
                        </h5>
                        <h3 class="text-danger" id="totalEvents">-</h3>
                        <small class="text-muted">活跃: <span id="activeEvents">-</span></small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card">
                    <div class="card-body text-center">
                        <h5 class="card-title">
                            <i class="fas fa-fire text-warning"></i> 正在触发
                        </h5>
                        <h3 class="text-warning" id="firingEvents">-</h3>
                        <small class="text-muted">需要立即处理</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card">
                    <div class="card-body text-center">
                        <h5 class="card-title">
                            <i class="fas fa-check-circle text-success"></i> 已解决
                        </h5>
                        <h3 class="text-success" id="resolvedEvents">-</h3>
                        <small class="text-muted">问题已修复</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- 主要内容区域 -->
        <div class="row">
            <!-- 节点状态 -->
            <div class="col-md-12 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-server"></i> 节点状态
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="nodesList">
                            <div class="text-center">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- 告警规则列表 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-cogs"></i> 告警规则
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="alertRulesList">
                            <div class="text-center">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 告警事件列表 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-exclamation-triangle"></i> 告警事件
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="alertEventsList">
                            <div class="text-center">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全局变量
        let refreshInterval;
        let isRefreshing = false;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboardData();
            startAutoRefresh();
        });

        // 加载仪表板数据
        async function loadDashboardData() {
            if (isRefreshing) return;
            isRefreshing = true;
            
            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.classList.add('fa-spin');
            
            try {
                const response = await fetch('/api/dashboard-data');
                const data = await response.json();
                
                updateDashboard(data);
                updateLastRefreshTime();
            } catch (error) {
                console.error('加载数据失败:', error);
                showError('加载数据失败: ' + error.message);
            } finally {
                isRefreshing = false;
                refreshIcon.classList.remove('fa-spin');
            }
        }

        // 更新仪表板
        function updateDashboard(data) {
            // 更新统计卡片
            updateMetricCards(data);
            
            // 更新节点列表
            updateNodesList(data.nodes, data.node_metrics);
            
            // 更新告警规则列表
            updateAlertRulesList(data.alert_rules);
            
            // 更新告警事件列表
            updateAlertEventsList(data.alert_events);
        }

        // 更新统计卡片
        function updateMetricCards(data) {
            document.getElementById('totalRules').textContent = data.alert_rules.total || 0;
            document.getElementById('activeRules').textContent = data.active_alert_rules.total || 0;
            document.getElementById('totalEvents').textContent = data.alert_events.total || 0;
            document.getElementById('activeEvents').textContent = data.active_alert_events.total || 0;
            document.getElementById('firingEvents').textContent = data.firing_events.total || 0;
            document.getElementById('resolvedEvents').textContent = data.resolved_events.total || 0;
        }

        // 更新节点列表
        function updateNodesList(nodesData, nodeMetricsData) {
            const container = document.getElementById('nodesList');
            
            if (nodesData.code !== 0) {
                container.innerHTML = `<div class="alert alert-danger">${nodesData.message}</div>`;
                return;
            }
            
            if (!nodesData.nodes || nodesData.nodes.length === 0) {
                container.innerHTML = '<div class="text-muted text-center">暂无节点</div>';
                return;
            }
            
            let html = '';
            nodesData.nodes.forEach(node => {
                const statusClass = getNodeStatusClass(node.status);
                const onlineBadge = node.isOnline ? 
                    '<span class="badge bg-success">在线</span>' : 
                    '<span class="badge bg-danger">离线</span>';
                
                const lastSeen = new Date(node.lastSeenAt * 1000).toLocaleString();
                
                // 获取该节点的指标数据
                const metrics = nodeMetricsData[node.nodeId];
                let metricsHtml = '';
                if (metrics && metrics.code === 0 && metrics.metrics && metrics.metrics.length > 0) {
                    const latestMetric = metrics.metrics[metrics.metrics.length - 1];
                    metricsHtml = `
                        <div class="row mt-2">
                            <div class="col-3">
                                <small class="text-muted">CPU: <span class="text-primary">${latestMetric.cpuUsage.toFixed(1)}%</span></small>
                            </div>
                            <div class="col-3">
                                <small class="text-muted">内存: <span class="text-info">${latestMetric.memoryUsage.toFixed(1)}%</span></small>
                            </div>
                            <div class="col-3">
                                <small class="text-muted">磁盘: <span class="text-warning">${latestMetric.diskUsage.toFixed(1)}%</span></small>
                            </div>
                            <div class="col-3">
                                <small class="text-muted">网络: <span class="text-success">${latestMetric.networkRxRate.toFixed(0)}/s</span></small>
                            </div>
                        </div>
                    `;
                }
                
                html += `
                    <div class="card mb-2">
                        <div class="card-body py-2">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="flex-grow-1">
                                    <h6 class="mb-1">
                                        <i class="fas fa-server"></i> ${node.hostname}
                                        <span class="badge ${statusClass}">${node.status}</span>
                                        ${onlineBadge}
                                    </h6>
                                    <small class="text-muted">ID: ${node.nodeId} | IP: ${node.ipAddress}</small>
                                    <br>
                                    <small class="text-muted">最后更新: ${lastSeen}</small>
                                    ${metricsHtml}
                                </div>
                                <div class="ms-3">
                                    <button class="btn btn-outline-primary btn-sm" onclick="viewNodeDetail('${node.nodeId}')">
                                        <i class="fas fa-chart-line"></i> 查看详情
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // 查看节点详情
        function viewNodeDetail(nodeId) {
            window.open(`/node/${nodeId}`, '_blank');
        }

        // 获取节点状态样式类
        function getNodeStatusClass(status) {
            switch (status) {
                case 'HEALTHY': return 'bg-success';
                case 'WARNING': return 'bg-warning';
                case 'CRITICAL': return 'bg-danger';
                default: return 'bg-secondary';
            }
        }

        // 更新告警规则列表
        function updateAlertRulesList(rulesData) {
            const container = document.getElementById('alertRulesList');
            
            if (rulesData.code !== 0) {
                container.innerHTML = `<div class="alert alert-danger">${rulesData.message}</div>`;
                return;
            }
            
            if (!rulesData.rules || rulesData.rules.length === 0) {
                container.innerHTML = '<div class="text-muted text-center">暂无告警规则</div>';
                return;
            }
            
            let html = '';
            rulesData.rules.forEach(rule => {
                const statusBadge = rule.enabled ? 
                    '<span class="badge bg-success">启用</span>' : 
                    '<span class="badge bg-secondary">禁用</span>';
                
                const severityClass = rule.severity === 'CRITICAL' ? 'severity-critical' : 'severity-warning';
                
                // 处理多条件规则
                let conditionsText = '';
                if (rule.expression && rule.expression.conditions) {
                    const conditions = rule.expression.conditions.map(condition => 
                        `${condition.metric} ${condition.operator} ${condition.threshold}`
                    ).join(` ${rule.expression.logic} `);
                    conditionsText = conditions;
                } else {
                    // 兼容旧格式
                    conditionsText = `${rule.metricName || ''} ${rule.operator || ''} ${rule.threshold || ''}`;
                }
                
                html += `
                    <div class="card mb-2">
                        <div class="card-body py-2">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="mb-1">${rule.alert_name || rule.ruleName || 'Unknown Rule'}</h6>
                                    <small class="text-muted">${conditionsText}</small>
                                    ${rule.description ? `<br><small class="text-info">${rule.description}</small>` : ''}
                                </div>
                                <div class="text-end">
                                    ${statusBadge}
                                    <br>
                                    <small class="${severityClass}">${rule.severity}</small>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // 更新告警事件列表
        function updateAlertEventsList(eventsData) {
            const container = document.getElementById('alertEventsList');
            
            if (eventsData.code !== 0) {
                container.innerHTML = `<div class="alert alert-danger">${eventsData.message}</div>`;
                return;
            }
            
            if (!eventsData.events || eventsData.events.length === 0) {
                container.innerHTML = '<div class="text-muted text-center">暂无告警事件</div>';
                return;
            }
            
            let html = '';
            eventsData.events.forEach(event => {
                const statusClass = event.status.toLowerCase();
                const severityClass = event.severity.toLowerCase();
                
                const startTime = new Date(event.startAt * 1000).toLocaleString();
                const triggeredValue = event.triggeredValue.toFixed(2);
                
                html += `
                    <div class="alert-item ${statusClass} card mb-2">
                        <div class="card-body py-2">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="mb-1">
                                        <span class="status-${statusClass}">${event.status}</span>
                                        <span class="severity-${severityClass}">${event.severity}</span>
                                    </h6>
                                    <small class="text-muted">规则ID: ${event.ruleId} | 节点: ${event.nodeId}</small>
                                    <br>
                                    <small class="text-muted">触发值: ${triggeredValue}% | 时间: ${startTime}</small>
                                    <br>
                                    <small class="text-muted">${event.details}</small>
                                </div>
                                <div class="text-end">
                                    ${getEventActions(event)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // 获取事件操作按钮
        function getEventActions(event) {
            let actions = '';
            
            if (event.status === 'FIRING') {
                actions += `
                    <button class="btn btn-warning btn-sm me-1" onclick="acknowledgeEvent(${event.eventId})">
                        <i class="fas fa-eye"></i> 认知
                    </button>
                `;
            }
            
            if (event.status === 'FIRING' || event.status === 'ACKNOWLEDGED') {
                actions += `
                    <button class="btn btn-success btn-sm" onclick="resolveEvent(${event.eventId})">
                        <i class="fas fa-check"></i> 解决
                    </button>
                `;
            }
            
            return actions;
        }

        // 认知告警事件
        async function acknowledgeEvent(eventId) {
            try {
                const response = await fetch('/api/acknowledge-event', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        eventId: eventId,
                        operatorId: 'admin'
                    })
                });
                
                const result = await response.json();
                
                if (result.code === 0) {
                    showSuccess('告警事件已认知');
                    loadDashboardData(); // 刷新数据
                } else {
                    showError('认知失败: ' + result.message);
                }
            } catch (error) {
                showError('认知失败: ' + error.message);
            }
        }

        // 解决告警事件
        async function resolveEvent(eventId) {
            try {
                const response = await fetch('/api/resolve-event', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        eventId: eventId
                    })
                });
                
                const result = await response.json();
                
                if (result.code === 0) {
                    showSuccess('告警事件已解决');
                    loadDashboardData(); // 刷新数据
                } else {
                    showError('解决失败: ' + result.message);
                }
            } catch (error) {
                showError('解决失败: ' + error.message);
            }
        }

        // 开始自动刷新
        function startAutoRefresh() {
            refreshInterval = setInterval(loadDashboardData, 5000); // 每5秒刷新一次
        }

        // 更新最后刷新时间
        function updateLastRefreshTime() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent = 
                `最后更新: ${now.toLocaleTimeString()}`;
        }

        // 显示成功消息
        function showSuccess(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-success alert-dismissible fade show position-fixed';
            alert.style.top = '80px';
            alert.style.right = '20px';
            alert.style.zIndex = '9999';
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        // 显示错误消息
        function showError(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-danger alert-dismissible fade show position-fixed';
            alert.style.top = '80px';
            alert.style.right = '20px';
            alert.style.zIndex = '9999';
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // 页面卸载时清理定时器
        window.addEventListener('beforeunload', function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
