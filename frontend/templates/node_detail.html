<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节点资源使用情况 - {{ node_id }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        .metric-card { transition: transform 0.2s; }
        .metric-card:hover { transform: translateY(-2px); }
        .chart-container { position: relative; height: 300px; }
        .time-range-btn { margin-right: 5px; }
        .loading-spinner { text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 页面标题 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1>
                            <i class="fas fa-server"></i> 节点资源使用情况
                        </h1>
                        <p class="text-muted mb-0">节点ID: {{ node_id }}</p>
                    </div>
                    <div>
                        <button class="btn btn-outline-secondary" onclick="window.close()">
                            <i class="fas fa-times"></i> 关闭
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 节点基本信息 -->
        <div class="row mb-4" id="nodeInfo">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-info-circle"></i> 节点信息
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="loading-spinner">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 时间范围选择 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-title">
                            <i class="fas fa-clock"></i> 时间范围
                        </h6>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-primary time-range-btn" onclick="changeTimeRange('1h')">1小时</button>
                            <button type="button" class="btn btn-outline-primary time-range-btn" onclick="changeTimeRange('6h')">6小时</button>
                            <button type="button" class="btn btn-outline-primary time-range-btn" onclick="changeTimeRange('24h')">24小时</button>
                            <button type="button" class="btn btn-outline-primary time-range-btn" onclick="changeTimeRange('7d')">7天</button>
                        </div>
                        <span class="ms-3 text-muted" id="timeRangeInfo">当前: 1小时</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 资源使用图表 -->
        <div class="row mb-4">
            <!-- CPU使用率 -->
            <div class="col-md-6">
                <div class="card metric-card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-microchip text-primary"></i> CPU使用率
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="cpuChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 内存使用率 -->
            <div class="col-md-6">
                <div class="card metric-card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-memory text-info"></i> 内存使用率
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="memoryChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <!-- 磁盘使用率 -->
            <div class="col-md-6">
                <div class="card metric-card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-hdd text-warning"></i> 磁盘使用率
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="diskChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 网络速率 -->
            <div class="col-md-6">
                <div class="card metric-card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-network-wired text-success"></i> 网络速率
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="networkChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-table"></i> 详细数据
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>时间</th>
                                        <th>CPU使用率</th>
                                        <th>内存使用率</th>
                                        <th>磁盘使用率</th>
                                        <th>网络接收</th>
                                        <th>网络发送</th>
                                    </tr>
                                </thead>
                                <tbody id="metricsTable">
                                    <tr>
                                        <td colspan="6" class="text-center">
                                            <div class="spinner-border" role="status">
                                                <span class="visually-hidden">加载中...</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全局变量
        const nodeId = '{{ node_id }}';
        let currentTimeRange = '1h';
        let charts = {};
        let refreshInterval;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadNodeData();
            initializeCharts();
            startAutoRefresh();
        });

        // 加载节点数据
        async function loadNodeData() {
            try {
                const response = await fetch(`/api/node/${nodeId}/metrics-history?range=${currentTimeRange}`);
                const data = await response.json();
                
                if (data.code === 0) {
                    updateNodeInfo(data.node);
                    updateCharts(data.metrics);
                    updateMetricsTable(data.metrics);
                } else {
                    showError('加载数据失败: ' + data.message);
                }
            } catch (error) {
                console.error('加载数据失败:', error);
                showError('加载数据失败: ' + error.message);
            }
        }

        // 更新节点信息
        function updateNodeInfo(node) {
            const container = document.getElementById('nodeInfo').querySelector('.card-body');
            const statusClass = getNodeStatusClass(node.status);
            const onlineBadge = node.isOnline ? 
                '<span class="badge bg-success">在线</span>' : 
                '<span class="badge bg-danger">离线</span>';
            
            const lastSeen = new Date(node.lastSeenAt * 1000).toLocaleString();
            
            container.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <h6><i class="fas fa-server"></i> ${node.hostname}</h6>
                        <p class="text-muted mb-1">节点ID: ${node.nodeId}</p>
                        <p class="text-muted mb-1">IP地址: ${node.ipAddress}</p>
                        <p class="text-muted mb-0">最后更新: ${lastSeen}</p>
                    </div>
                    <div class="col-md-6 text-end">
                        <span class="badge ${statusClass} fs-6">${node.status}</span>
                        ${onlineBadge}
                    </div>
                </div>
            `;
        }

        // 初始化图表
        function initializeCharts() {
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            };

            // CPU图表
            charts.cpu = new Chart(document.getElementById('cpuChart'), {
                type: 'line',
                data: { 
                    labels: [],
                    datasets: [{
                        label: 'CPU使用率 (%)',
                        data: [],
                        borderColor: 'rgb(54, 162, 235)',
                        backgroundColor: 'rgba(54, 162, 235, 0.1)',
                        tension: 0.1
                    }]
                },
                options: {
                    ...commonOptions,
                    scales: {
                        ...commonOptions.scales,
                        y: {
                            ...commonOptions.scales.y,
                            max: 100
                        }
                    }
                }
            });

            // 内存图表
            charts.memory = new Chart(document.getElementById('memoryChart'), {
                type: 'line',
                data: { 
                    labels: [],
                    datasets: [{
                        label: '内存使用率 (%)',
                        data: [],
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.1)',
                        tension: 0.1
                    }]
                },
                options: {
                    ...commonOptions,
                    scales: {
                        ...commonOptions.scales,
                        y: {
                            ...commonOptions.scales.y,
                            max: 100
                        }
                    }
                }
            });

            // 磁盘图表
            charts.disk = new Chart(document.getElementById('diskChart'), {
                type: 'line',
                data: { 
                    labels: [],
                    datasets: [{
                        label: '磁盘使用率 (%)',
                        data: [],
                        borderColor: 'rgb(255, 206, 86)',
                        backgroundColor: 'rgba(255, 206, 86, 0.1)',
                        tension: 0.1
                    }]
                },
                options: {
                    ...commonOptions,
                    scales: {
                        ...commonOptions.scales,
                        y: {
                            ...commonOptions.scales.y,
                            max: 100
                        }
                    }
                }
            });

            // 网络图表
            charts.network = new Chart(document.getElementById('networkChart'), {
                type: 'line',
                data: { 
                    labels: [],
                    datasets: [
                        {
                            label: '接收速率 (bytes/s)',
                            data: [],
                            borderColor: 'rgb(34, 197, 94)',
                            backgroundColor: 'rgba(34, 197, 94, 0.1)',
                            tension: 0.1
                        },
                        {
                            label: '发送速率 (bytes/s)',
                            data: [],
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            tension: 0.1
                        }
                    ]
                },
                options: commonOptions
            });
        }

        // 更新图表
        function updateCharts(metricsData) {
            if (metricsData.code !== 0 || !metricsData.metrics || metricsData.metrics.length === 0) {
                return;
            }

            const metrics = metricsData.metrics;
            const labels = metrics.map((m, index) => index); // 使用索引作为X轴标签
            const cpuData = metrics.map(m => m.cpuUsage);
            const memoryData = metrics.map(m => m.memoryUsage);
            const diskData = metrics.map(m => m.diskUsage);
            const networkRxData = metrics.map(m => m.networkRxRate);
            const networkTxData = metrics.map(m => m.networkTxRate);

            // 更新CPU图表
            if (charts.cpu) {
                charts.cpu.data.labels = labels;
                charts.cpu.data.datasets[0].data = cpuData;
                charts.cpu.update();
            }

            // 更新内存图表
            if (charts.memory) {
                charts.memory.data.labels = labels;
                charts.memory.data.datasets[0].data = memoryData;
                charts.memory.update();
            }

            // 更新磁盘图表
            if (charts.disk) {
                charts.disk.data.labels = labels;
                charts.disk.data.datasets[0].data = diskData;
                charts.disk.update();
            }

            // 更新网络图表
            if (charts.network) {
                charts.network.data.labels = labels;
                charts.network.data.datasets[0].data = networkRxData;
                charts.network.data.datasets[1].data = networkTxData;
                charts.network.update();
            }
        }

        // 更新数据表格
        function updateMetricsTable(metricsData) {
            const tbody = document.getElementById('metricsTable');
            
            if (metricsData.code !== 0 || !metricsData.metrics || metricsData.metrics.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">暂无数据</td></tr>';
                return;
            }

            const metrics = metricsData.metrics;
            let html = '';
            
            // 显示最近20条数据
            const recentMetrics = metrics.slice(-20).reverse();
            
            recentMetrics.forEach(metric => {
                const time = new Date(metric.timestamp * 1000).toLocaleString();
                html += `
                    <tr>
                        <td>${time}</td>
                        <td><span class="badge bg-primary">${metric.cpuUsage.toFixed(1)}%</span></td>
                        <td><span class="badge bg-info">${metric.memoryUsage.toFixed(1)}%</span></td>
                        <td><span class="badge bg-warning">${metric.diskUsage.toFixed(1)}%</span></td>
                        <td><span class="text-success">${formatBytes(metric.networkRxRate)}/s</span></td>
                        <td><span class="text-danger">${formatBytes(metric.networkTxRate)}/s</span></td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        }

        // 改变时间范围
        function changeTimeRange(range) {
            currentTimeRange = range;
            document.getElementById('timeRangeInfo').textContent = `当前: ${getTimeRangeText(range)}`;
            
            // 更新按钮状态
            document.querySelectorAll('.time-range-btn').forEach(btn => {
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-outline-primary');
            });
            event.target.classList.remove('btn-outline-primary');
            event.target.classList.add('btn-primary');
            
            loadNodeData();
        }

        // 获取时间范围文本
        function getTimeRangeText(range) {
            const rangeMap = {
                '1h': '1小时',
                '6h': '6小时',
                '24h': '24小时',
                '7d': '7天'
            };
            return rangeMap[range] || range;
        }

        // 格式化字节数
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        // 获取节点状态样式类
        function getNodeStatusClass(status) {
            switch (status) {
                case 'HEALTHY': return 'bg-success';
                case 'WARNING': return 'bg-warning';
                case 'CRITICAL': return 'bg-danger';
                default: return 'bg-secondary';
            }
        }

        // 开始自动刷新
        function startAutoRefresh() {
            refreshInterval = setInterval(loadNodeData, 30000); // 每30秒刷新一次
        }

        // 显示错误消息
        function showError(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-danger alert-dismissible fade show position-fixed';
            alert.style.top = '20px';
            alert.style.right = '20px';
            alert.style.zIndex = '9999';
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // 页面卸载时清理定时器
        window.addEventListener('beforeunload', function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
